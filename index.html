<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Vite + Lit + TS</title>
        <link
            rel="stylesheet"
            href="https://early.webawesome.com/webawesome@3.0.0-beta.3/dist/styles/themes/awesome.css"
        />
        <script type="module" src="/src/col-cal.ts"></script>
    </head>
    <body>
        <col-cal locale="ru"></col-cal>
    </body>
    <script>
        customElements.whenDefined("col-cal").then(() => {
            const calendar = document.querySelector("col-cal");
            if (calendar) {
                const date = new Date();
                calendar.setAttribute("date", date);
            }
        });
    </script>
</html>
